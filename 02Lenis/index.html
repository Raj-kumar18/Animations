<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.23/dist/lenis.css">
    <title>Lenis</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .grid{
            overflow: hidden;
        }
        .grid>div {
            grid-row: var(--r);
            grid-column: var(--c);
        }

        .grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <div class="w-full  bg-zinc-900">

        <div class="grid grid-cols-8 grid-rows-[repeat(10,minmax(0,1fr))] gap-4 pb-20">
            <div class="elem col-span-1 row-span-1" style="--r:1;--c:7"><img src="./images/2.jpg" alt=""></div>
            <div class="elem col-span-1 row-span-1" style="--r:1;--c:3"><img src="./images/1.jpg" alt=""></div>
            <div class="elem col-span-1 row-span-1" style="--r:2;--c:2"><img src="./images/3.jpg" alt=""></div>
            <div class="elem col-span-1 row-span-1" style="--r:2;--c:6"><img src="./images/4.jpg" alt=""></div>
            <div class="elem col-span-1 row-span-1" style="--r:3;--c:4"><img src="./images/5.jpg" alt=""></div>
            <div class="elem col-span-1 row-span-1" style="--r:3;--c:8"><img src="./images/6.jpg" alt=""></div>
            <div class="elem col-span-1 row-span-1" style="--r:4;--c:1"><img src="./images/7.jpg" alt=""></div>
            <div class="elem col-span-1 row-span-1" style="--r:4;--c:4"><img src="./images/8.jpg" alt=""></div>
            <div class="elem col-span-1 row-span-1" style="--r:5;--c:2"><img src="./images/9.jpg" alt=""></div>
            <div class="elem col-span-1 row-span-1" style="--r:5;--c:6"><img src="./images/10.jpg" alt=""></div>
            <div class="elem col-span-1 row-span-1" style="--r:6;--c:3"><img src="./images/11.jpg" alt=""></div>
            <div class="elem col-span-1 row-span-1" style="--r:6;--c:7"><img src="./images/12.jpg" alt=""></div>
            <div class="elem col-span-1 row-span-1" style="--r:7;--c:5"><img src="./images/13.jpg" alt=""></div>
            <div class="elem col-span-1 row-span-1" style="--r:7;--c:8"><img src="./images/14.jpg" alt=""></div>
            <div class="elem col-span-1 row-span-1" style="--r:8;--c:1"><img src="./images/15.jpg" alt=""></div>
            <div class="elem col-span-1 row-span-1" style="--r:8;--c:4"><img src="./images/16.jpg" alt=""></div>
            <div class="elem col-span-1 row-span-1" style="--r:9;--c:2"><img src="./images/17.jpg" alt=""></div>
            <div class="elem col-span-1 row-span-1" style="--r:9;--c:6"><img src="./images/18.jpg" alt=""></div>
            <div class="elem col-span-1 row-span-1" style="--r:10;--c:3"><img src="./images/19.jpg" alt=""></div>
            <div class="elem col-span-1 row-span-1" style="--r:10;--c:7"><img src="./images/20.jpg" alt=""></div>

        </div>

        <div
            class="fixed top-0 left-0 w-full h-screen flex flex-col items-center justify-center bg-black-600 text-white">
            <h1 class="text-6xl mb-4">Biggest Text Field</h1>
            <h2 class="text-4xl">Smaller Text Field</h2>

        </div>


        <div
            class="w-full flex items-center justify-center h-screen bg-[#D1D1D1] mx-auto py-96 z-[1] relative text-center">
            <p class="text-black text-4xl text-center w-3/4">
                Lorem ipsum dolor sit amet, consectetur adipisicing elit. Molestias tempora dolor cum incidunt iure
                veniam ut, repellat dolorum, pariatur officia perferendis! Placeat, distinctio quae recusandae nostrum
                dolorem ad veritatis voluptatibus!
            </p>
        </div>

    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"
        integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"
        integrity="sha512-P2IDYZfqSwjcSjX0BKeNhwRUH8zRPGlgcWl5n6gBLzdi4Y5/0O4zaXrtO4K9TZK6Hn1BenYpKowuCavNandERg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://unpkg.com/lenis@1.3.23/dist/lenis.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
