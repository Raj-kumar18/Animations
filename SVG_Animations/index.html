        <!-- SVG = Scalable Vector Graphics. It's HTML for drawing — instead of <div>, you get <circle></circle> -->
        <!-- 
    It's math, not pixels, so it never blurs when scaled — and since it lives in the DOM, CSS can style and animate it exactly like an HTML element.

One thing worth knowing before anything else: an SVG's `(0,0)` origin is the **top-left corner** of the canvas, not the center. Keep that in mind — it explains the `transform-origin` gotcha in Section 3. -->
        <!-- 
# The `transform-origin` trap ⚠️

The #1 "why is my shape flying off into space" bug. By default, `transform-origin` is the **top-left of the whole SVG canvas** — not the center of your shape. So `rotate()` on a circle sitting away from the corner orbits it like a satellite instead of spinning in place.

**The two-line fix — always add these when rotating/scaling SVG shapes:**

```css
.your-shape {
  transform-box: fill-box;   /* use the shape's own bounding box */
  transform-origin: center;  /* now "center" means the shape's center */
}
``` -->

            # `stroke-dasharray`, done properly

    You've probably seen the "line draws itself" trick with a random big `stroke-dasharray` number (like `1000`), hoping it's bigger than the path. Here's the actual professional version.

    SVG paths have a `pathLength` attribute that lets **you** define what "100%" means, instead of relying on the browser's real geometric length. Set it to `1`, and `stroke-dasharray`/`stroke-dashoffset` become clean fractions from `0` to `1` — no guessing, no measuring.
            -->
